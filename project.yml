name: DeepSeaFishing

options:
  bundleIdPrefix: com.orlandojohnson
  deploymentTarget:
    iOS: "17.0"
  defaultConfig: Debug
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_PREVIEWS: YES

targets:
  DeepSeaFishing:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DeepSeaFishing
        excludes:
          - "Preview Content/**"
      - path: DeepSeaFishing/Preview Content
        type: group
        buildPhase: resources
    resources:
      - DeepSeaFishing/Assets.xcassets
      - DeepSeaFishing/Preview Content/Preview Assets.xcassets
    settings:
      base:
        PRODUCT_NAME: DeepSeaFishing
        PRODUCT_BUNDLE_IDENTIFIER: com.orlandojohnson.DeepSeaFishing
        INFOPLIST_FILE: DeepSeaFishing/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: N724Z4725Y
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    info:
      path: DeepSeaFishing/Info.plist
      properties:
        CFBundleDisplayName: "Deep Sea Fishing"
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "2"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: "Deep Sea Fishing finds your Apple TV so your iPhone can be its controller."
        NSBonjourServices:
          - _dsf-pad._tcp
          - _dsf-pad._udp
        GCSupportedGameControllers:
          - ProfileName: ExtendedGamepad
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSMotionUsageDescription: "Deep Sea Fishing uses motion sensors so you can cast and reel by tilting your device, and feel the fight through haptics."
    scheme:
      testTargets:
        - DeepSeaFishingTests

  DeepSeaFishingTV:
    type: application
    platform: tvOS
    deploymentTarget: "17.0"
    sources:
      - path: DeepSeaFishing
        excludes:
          - "Preview Content/**"
          - Info.plist
          - "Assets.xcassets/AppIcon.appiconset/**"
      - path: DeepSeaFishingTV
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_NAME: DeepSeaFishing
        PRODUCT_BUNDLE_IDENTIFIER: com.orlandojohnson.DeepSeaFishing
        INFOPLIST_FILE: DeepSeaFishingTV/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: N724Z4725Y
        TARGETED_DEVICE_FAMILY: "3"
        TVOS_DEPLOYMENT_TARGET: "17.0"
    info:
      path: DeepSeaFishingTV/Info.plist
      properties:
        CFBundleDisplayName: "Deep Sea Fishing"
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: "Deep Sea Fishing finds your Apple TV so your iPhone can be its controller."
        NSBonjourServices:
          - _dsf-pad._tcp
          - _dsf-pad._udp
        GCSupportedGameControllers:
          - ProfileName: ExtendedGamepad

  DeepSeaFishingTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DeepSeaFishingTests
    dependencies:
      - target: DeepSeaFishing
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.orlandojohnson.DeepSeaFishingTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: N724Z4725Y
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
